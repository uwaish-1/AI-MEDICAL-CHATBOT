[project]
name = "ai-medical-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uwaish-1", email = "uwaishm82@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fonttools>=4.67.0",
    "langchain>=1.4.6",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "torchvision>=0.29.1",
]

[project.scripts]
ai-medical-chatbot = "ai_medical_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
